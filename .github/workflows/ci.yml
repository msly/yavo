name: Yavo CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - '**'
      - '!**/*.md'
      - '!compiler/validation/*.json'
      - '!benchmarks/**/results/*.json'
      # Frozen experiment inputs must run their preparation gate, even as Markdown.
      - 'docs/agent-api-index.md'
      - 'docs/agent-start.md'
      - 'experiments/docs-ab-2026-11-22-r6/**'
      - 'tools/agent_eval/README.md'
  pull_request:
    paths:
      - '**'
      - '!**/*.md'
      - '!compiler/validation/*.json'
      - '!benchmarks/**/results/*.json'
      - 'docs/agent-api-index.md'
      - 'docs/agent-start.md'
      - 'experiments/docs-ab-2026-11-22-r6/**'
      - 'tools/agent_eval/README.md'
  workflow_dispatch:
    inputs:
      tier:
        description: Validation tier (cadence and milestones cannot be downgraded)
        type: choice
        default: auto
        options: [auto, core, full]

permissions:
  contents: read

concurrency:
  group: yavo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: 1.99.1
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1

jobs:
  plan:
    name: Validation tier
    runs-on: ubuntu-24.04
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      baseline: ${{ steps.plan.outputs.baseline }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check tier and changed-case selection controls
        run: python3 tools/ci/validation_plan_test.py
      - name: Check preserved diagnostic fixture promotions
        run: python3 selfhost/tests/diagnostics52/test_promotions.py
      - name: Check accepted reference warning handling
        run: python3 tools/ci/selfhost_errors_test.py
      - name: Check UTF-8 protocols under an ANSI default encoding
        run: python3 tools/ci/subset_encoding_test.py
      - id: plan
        env:
          REQUESTED_TIER: ${{ inputs.tier || 'auto' }}
        run: python3 tools/ci/validation_plan.py --requested "$REQUESTED_TIER"

  native:
    needs: plan
    name: Native ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    # Batch53 Windows finished every Full gate and upload in 90m19s.
    # Leave headroom for Full validation and archiving; retain the Core budget.
    timeout-minutes: ${{ needs.plan.outputs.tier == 'full' && 120 || 90 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86_64
            runner: ubuntu-24.04
            python: python3
            suite: full
            machine: x86_64
          - platform: Windows x86_64
            runner: windows-2025
            python: python
            suite: native
            machine: AMD64
          - platform: macOS arm64
            runner: macos-15
            python: python3
            suite: native
            machine: arm64
    env:
      YAVO_CI_MACHINE: ${{ matrix.machine }}
    steps:
      - name: Preserve frozen input bytes on checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Windows runners have downloaded the Zig archive at about 60 KB/s; reuse the
      # installed toolchain, keyed by the lock file that pins its URL and hash.
      - name: Restore the locked Zig toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/yavo-home/toolchains
          key: yavo-zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('compiler/toolchain.lock') }}
      - name: Build compiler and install the locked Zig toolchain
        env:
          YAVO_HOME: ${{ runner.temp }}/yavo-home
          YAVO_CACHE_DIR: ${{ runner.temp }}/yavo-cache
        run: ${{ matrix.python }} tools/ci/run.py setup
      - name: Run Debug and Release sequentially
        if: needs.plan.outputs.tier == 'full'
        env:
          YAVO_HOME: ${{ runner.temp }}/yavo-home
          YAVO_CACHE_DIR: ${{ runner.temp }}/yavo-cache
        run: ${{ matrix.python }} tools/ci/run.py native --suite ${{ matrix.suite }}
      - name: Check the complete blocker-analysis contract
        run: cargo test --manifest-path compiler/Cargo.toml --locked --offline --release --test subset_features
      - name: Compile starter-guide examples and ownership diagnostics
        if: needs.plan.outputs.tier == 'full' && matrix.suite == 'full'
        env:
          YAVO_HOME: ${{ runner.temp }}/yavo-home
          YAVO_CACHE_DIR: ${{ runner.temp }}/yavo-cache
        run: python3 tools/ci/agent_docs.py
      - name: Build and validate the Yavo-written subset frontend
        env:
          YAVO_HOME: ${{ runner.temp }}/yavo-home
          YAVO_CACHE_DIR: ${{ runner.temp }}/yavo-cache
        run: ${{ matrix.python }} selfhost/bootstrap.py --tier ${{ needs.plan.outputs.tier }} --baseline ${{ needs.plan.outputs.baseline }}
      - name: Sweep the original corpus with the final selfhost compiler
        run: ${{ matrix.python }} tools/ci/subset_core.py --bootstrap-output compiler/target/ci/selfhost
      - name: Record self-compilation timing, memory and generated sizes
        run: ${{ matrix.python }} tools/ci/selfhost_metrics.py --bootstrap-output compiler/target/ci/selfhost
      - name: Validate original enum and result programs
        if: needs.plan.outputs.tier == 'full'
        run: ${{ matrix.python }} tools/ci/selfhost_patterns.py --bootstrap-output compiler/target/ci/selfhost --originals
      - name: Check pattern payload destruction before arm execution
        if: needs.plan.outputs.tier == 'full'
        run: ${{ matrix.python }} tools/ci/selfhost_patterns.py --bootstrap-output compiler/target/ci/selfhost --case patterns53_drop_before_body
      - name: Check isolated application runner configurations
        if: needs.plan.outputs.tier == 'full'
        run: ${{ matrix.python }} tools/ci/dep_support_test.py
      - name: Validate ordinary selfhost build and run
        if: needs.plan.outputs.tier == 'full'
        env:
          YAVO_HOME: ${{ runner.temp }}/yavo-home
          YAVO_CACHE_DIR: ${{ runner.temp }}/yavo-cache
        run: ${{ matrix.python }} tools/ci/selfhost_driver.py --bootstrap-output compiler/target/ci/selfhost
      - name: Validate selfhost source hashing
        if: needs.plan.outputs.tier == 'full'
        env:
          YAVO_HOME: ${{ runner.temp }}/yavo-home
          YAVO_CACHE_DIR: ${{ runner.temp }}/yavo-cache
        run: ${{ matrix.python }} tools/ci/selfhost_digest.py --bootstrap-output compiler/target/ci/selfhost
      - name: Validate selfhost structured diagnostics
        if: needs.plan.outputs.tier == 'full'
        env:
          YAVO_HOME: ${{ runner.temp }}/yavo-home
          YAVO_CACHE_DIR: ${{ runner.temp }}/yavo-cache
        run: ${{ matrix.python }} tools/ci/selfhost_diagnostics.py --bootstrap-output compiler/target/ci/selfhost
      - name: Validate selfhost standard error values
        if: needs.plan.outputs.tier == 'full'
        env:
          YAVO_HOME: ${{ runner.temp }}/yavo-home
          YAVO_CACHE_DIR: ${{ runner.temp }}/yavo-cache
        run: ${{ matrix.python }} tools/ci/selfhost_errors.py --bootstrap-output compiler/target/ci/selfhost --sanitizers ${{ runner.os == 'Linux' && 'required' || 'off' }}
      - name: Validate the test-summary CLI application
        if: needs.plan.outputs.tier == 'full'
        env:
          YAVO_HOME: ${{ runner.temp }}/yavo-home
          YAVO_CACHE_DIR: ${{ runner.temp }}/yavo-cache
        run: ${{ matrix.python }} tools/ci/test_summary.py
      - name: Validate the csv-check CLI application
        if: needs.plan.outputs.tier == 'full'
        env:
          YAVO_HOME: ${{ runner.temp }}/yavo-home
          YAVO_CACHE_DIR: ${{ runner.temp }}/yavo-cache
        run: ${{ matrix.python }} tools/ci/csv_check.py --bootstrap-output compiler/target/ci/selfhost --sanitizers ${{ runner.os == 'Linux' && 'required' || 'off' }}
      - name: Validate the dep-index CLI application
        if: needs.plan.outputs.tier == 'full'
        env:
          YAVO_HOME: ${{ runner.temp }}/yavo-home
          YAVO_CACHE_DIR: ${{ runner.temp }}/yavo-cache
        run: ${{ matrix.python }} tools/ci/dep_check.py --bootstrap-output compiler/target/ci/selfhost --sanitizers ${{ runner.os == 'Linux' && 'required' || 'off' }}
      - name: Check Yavo-frontend C with independent ASan and UBSan
        if: needs.plan.outputs.tier == 'full' && (runner.os == 'Linux')
        run: python3 tools/ci/selfhost_sanitize.py
      - name: Check system interfaces with required ASan and UBSan
        if: needs.plan.outputs.tier == 'full' && (runner.os == 'Linux')
        run: python3 tools/ci/system_sanitize.py --bootstrap-output compiler/target/ci/selfhost
      - name: Package application evidence with adversarial filenames
        if: needs.plan.outputs.tier == 'full' && (always())
        run: ${{ matrix.python }} tools/ci/package_test_summary.py
      - name: Package CSV application evidence
        if: needs.plan.outputs.tier == 'full' && (always())
        run: ${{ matrix.python }} tools/ci/package_test_summary.py --input compiler/target/ci/csv-check --output compiler/target/ci/csv-check.tar.gz --prefix csv-check
      - name: Package dependency-index application evidence
        if: needs.plan.outputs.tier == 'full' && (always())
        run: ${{ matrix.python }} tools/ci/package_test_summary.py --input compiler/target/ci/dep-index --output compiler/target/ci/dep-index.tar.gz --prefix dep-index
      - name: Package ordinary driver evidence
        if: needs.plan.outputs.tier == 'full' && (always())
        run: ${{ matrix.python }} tools/ci/package_test_summary.py --input compiler/target/ci/selfhost-driver --output compiler/target/ci/selfhost-driver.tar.gz --prefix selfhost-driver
      - name: Package selfhost source hashing evidence
        if: needs.plan.outputs.tier == 'full' && (always())
        run: ${{ matrix.python }} tools/ci/package_test_summary.py --input compiler/target/ci/selfhost-digest --output compiler/target/ci/selfhost-digest.tar.gz --prefix selfhost-digest
      - name: Package selfhost structured diagnostic evidence
        if: needs.plan.outputs.tier == 'full' && (always())
        run: ${{ matrix.python }} tools/ci/package_test_summary.py --input compiler/target/ci/selfhost-diagnostics --output compiler/target/ci/selfhost-diagnostics.tar.gz --prefix selfhost-diagnostics
      - name: Package selfhost standard error evidence
        if: needs.plan.outputs.tier == 'full' && (always())
        run: ${{ matrix.python }} tools/ci/package_test_summary.py --input compiler/target/ci/selfhost-errors --output compiler/target/ci/selfhost-errors.tar.gz --prefix selfhost-errors
      - name: Package system interface sanitizer evidence
        if: needs.plan.outputs.tier == 'full' && (always() && runner.os == 'Linux')
        run: python3 tools/ci/package_test_summary.py --input compiler/target/ci/system-sanitize --output compiler/target/ci/system-sanitize.tar.gz --prefix system-sanitize
      - name: Package selfhost sanitizer evidence
        if: needs.plan.outputs.tier == 'full' && (always() && runner.os == 'Linux')
        run: python3 tools/ci/package_test_summary.py --input compiler/target/ci/selfhost-sanitizers --output compiler/target/ci/selfhost-sanitizers.tar.gz --prefix selfhost-sanitizers
      - name: Preserve logs and per-platform receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.runner }}-${{ github.sha }}
          path: |
            compiler/target/ci/
            !compiler/target/ci/test-summary/**
            !compiler/target/ci/csv-check/**
            !compiler/target/ci/dep-index/**
            !compiler/target/ci/selfhost-driver/**
            !compiler/target/ci/selfhost-digest/**
            !compiler/target/ci/selfhost-diagnostics/**
            !compiler/target/ci/selfhost-errors/**
            !compiler/target/ci/system-sanitize/**
            !compiler/target/ci/selfhost-sanitizers/**
          if-no-files-found: error
          retention-days: 14


  agent-eval-preparation:
    needs: plan
    if: needs.plan.outputs.tier == 'full'
    name: Agent evaluation preparation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Preserve prepared experiment bytes on checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify offline contracts, new packet and unqualified launch refusal
        run: python3 tools/ci/agent_eval.py
      - name: Preserve preparation checks without claiming participant results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-eval-preparation-${{ github.sha }}
          path: compiler/target/ci/
          if-no-files-found: error
          retention-days: 14

  sanitizers:
    needs: plan
    if: needs.plan.outputs.tier == 'full'
    name: Independent Linux ASan and UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the exporter compiler
        run: python3 tools/ci/run.py setup --without-zig
      - name: Export current sources and validate generated C
        run: python3 tools/ci/run.py sanitize
      - name: Preserve sanitizer probes, programs, and receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sanitizers-linux-${{ github.sha }}
          path: compiler/target/ci/
          if-no-files-found: error
          retention-days: 14

  experiment-evidence:
    needs: plan
    if: needs.plan.outputs.tier == 'full'
    name: Round-five experiment evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Preserve frozen experiment bytes on checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the evidence gate
        run: python3 tools/ci/experiment_evidence.py --self-test
      - name: Verify frozen inputs, archived runs and experiment totals
        run: python3 tools/ci/experiment_evidence.py
      - name: Preserve experiment integrity receipt and verification logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: experiment-evidence-${{ github.sha }}
          path: compiler/target/ci/
          if-no-files-found: error
          retention-days: 14
